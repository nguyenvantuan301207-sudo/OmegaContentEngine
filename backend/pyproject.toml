[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omega"
version = "0.1.0"
description = "OMEGA — Autonomous Content Operating System"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "celery[redis]>=5.4.0",
    "pydantic-settings>=2.0.0",
    "structlog>=24.0.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
    "playwright==1.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
pythonpath = ["src"]


[tool.ruff]
src = ["src", "tests"]
target-version = "py312"
line-length = 100
extend-exclude = [
    "alembic/versions/001_*.py",
    "alembic/versions/002_*.py",
    "alembic/versions/003_*.py",
    "alembic/versions/004_*.py",
    "alembic/versions/005_*.py",
    "alembic/versions/006_*.py",
    "alembic/versions/007_*.py",
    "alembic/versions/008_*.py",
    "alembic/versions/009_*.py",
    "alembic/versions/010_*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]
